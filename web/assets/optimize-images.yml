name: Optimize journal images

on:
  push:
    paths:
      - "web/assets/page*.jpg"
      - "web/assets/page*.jpeg"
      - "web/assets/page*.png"
      - "web/assets/page*.webp"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Create optimized WebP images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("web/assets")
          out = src / "optimized"
          out.mkdir(exist_ok=True)

          exts = {".jpg", ".jpeg", ".png", ".webp"}

          for p in sorted(src.iterdir()):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              if not p.stem.lower().startswith("page"):
                  continue

              img = Image.open(p).convert("RGB")

              # 阅读器最大展示宽度约 1320px；保留双指放大空间，
              # 长边限制在 2200px，兼顾清晰度和流量。
              max_side = 2200
              if max(img.size) > max_side:
                  ratio = max_side / max(img.size)
                  img = img.resize(
                      (round(img.width * ratio), round(img.height * ratio)),
                      Image.Resampling.LANCZOS
                  )

              target = out / f"{p.stem}.webp"
              img.save(
                  target,
                  "WEBP",
                  quality=82,
                  method=6,
                  optimize=True
              )
              print(f"{p.name} -> {target.name} | {target.stat().st_size/1024:.0f} KB")
          PY

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/optimized
          if git diff --cached --quiet; then
            echo "No optimized image changes."
            exit 0
          fi
          git commit -m "Optimize journal images for web"
          git push
