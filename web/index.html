<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>HandJournal · 手账本</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:linear-gradient(135deg,#c6b9a7,#a99984);font-family:Georgia,"Times New Roman",serif;color:#3d382f}.reader{height:100%;display:flex;align-items:center;justify-content:center;padding:30px 15px 70px}.stage{position:relative;width:min(1320px,96vw);aspect-ratio:3/2;perspective:2400px;filter:drop-shadow(0 25px 28px rgba(35,25,15,.28))}.book{position:absolute;inset:0;transform-style:preserve-3d}.page{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background:#f4eee2}.left{left:0;border-radius:10px 0 0 10px}.right{left:50%;border-radius:0 16px 16px 0}.page img,.face img{width:200%;height:100%;max-width:none;object-fit:cover;display:block}.left img{transform:translateX(0)}.right img{transform:translateX(-50%)}.gutter{position:absolute;z-index:8;left:50%;top:0;bottom:0;width:18px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(60,43,28,.16),rgba(255,255,255,.35),rgba(60,43,28,.1),transparent)}.turning{position:absolute;z-index:20;top:0;width:50%;height:100%;display:none;transform-style:preserve-3d}.forward{left:50%;transform-origin:left center}.backward{left:0;transform-origin:right center}.turning.active.forward{display:block;animation:f .95s cubic-bezier(.19,.72,.15,1) forwards}.turning.active.backward{display:block;animation:b .95s cubic-bezier(.19,.72,.15,1) forwards}@keyframes f{to{transform:rotateY(-180deg)}}@keyframes b{to{transform:rotateY(180deg)}}.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;background:#f4eee2}.back{transform:rotateY(180deg)}.forward .front img{transform:translateX(-50%)}.forward .back img{transform:translateX(0)}.backward .front img{transform:translateX(0)}.backward .back img{transform:translateX(-50%)}.controls{position:fixed;z-index:50;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:rgba(246,239,228,.86);box-shadow:0 8px 22px rgba(39,29,18,.18)}button{border:0;background:transparent;width:42px;height:36px;border-radius:50%;font-size:22px;color:#4a4237}button:disabled{opacity:.25}.counter{min-width:70px;text-align:center;font:11px Arial,sans-serif;letter-spacing:1px}.hint{position:fixed;z-index:50;top:12px;left:50%;transform:translateX(-50%);font:10px Arial,sans-serif;color:#4b443b;background:rgba(246,239,228,.55);padding:6px 10px;border-radius:12px}.zone{position:absolute;z-index:30;top:0;bottom:0;width:20%}.prev{left:0}.next{right:0}@media(max-width:700px){.reader{padding:45px 0 70px}.stage{width:98vw}.hint{width:92vw;text-align:center}.gutter{width:12px}}html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}img{-webkit-user-drag:none}.stage{touch-action:pan-y}</style></head><body><div class="hint">左右滑动翻页 · 点击两侧也可以翻页</div><main class="reader"><div class="stage" id="stage"><div class="book"><div class="page left"><img id="L"></div><div class="page right"><img id="R"></div><div class="gutter"></div><div class="turning" id="turn"><div class="face front"><img id="F"></div><div class="face back"><img id="B"></div></div><div class="zone prev" id="P"></div><div class="zone next" id="N"></div></div></div></main><div class="controls"><button id="prev">‹</button><div class="counter" id="count"></div><button id="next">›</button></div><script>const S=['page1.jpg','page2.jpg','page3.jpg','page4.jpg','page5.jpg'].map(x=>'assets/'+x);let i=0,busy=false;const L=document.getElementById('L'),R=document.getElementById('R'),F=document.getElementById('F'),B=document.getElementById('B'),T=document.getElementById('turn'),C=document.getElementById('count'),stage=document.getElementById('stage');function show(){L.src=S[i];R.src=S[i];C.textContent=(i+1)+' / '+S.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===S.length-1}function next(){if(busy||i===S.length-1)return;busy=true;L.src=S[i];R.src=S[i+1];F.src=S[i];B.src=S[i+1];T.className='turning forward active';setTimeout(()=>{i++;show();T.className='turning';busy=false},960)}function prev(){if(busy||i===0)return;busy=true;L.src=S[i-1];R.src=S[i];F.src=S[i];B.src=S[i-1];T.className='turning backward active';setTimeout(()=>{i--;show();T.className='turning';busy=false},960)}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('N').onclick=next;document.getElementById('P').onclick=prev;addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});let x=null,y=null;stage.onpointerdown=e=>{x=e.clientX;y=e.clientY};stage.onpointerup=e=>{if(x===null)return;let dx=e.clientX-x,dy=e.clientY-y;x=y=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.15)(dx<0?next:prev)()};show();</script></body></html>
