name: Deploy HandJournal to Tencent COS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-cos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handjournal-cos-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools and COSCMD
        run: |
          python -m pip install --upgrade pip
          pip install pillow coscmd

      - name: Build China site
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re, shutil

          src = Path("web")
          build = Path("_site")
          assets = src / "assets"
          opt = build / "assets" / "optimized"

          if build.exists():
              shutil.rmtree(build)
          opt.mkdir(parents=True, exist_ok=True)

          shutil.copy2(src / "index.html", build / "index.html")

          pattern = re.compile(r"^page(\d+)\.(jpg|jpeg|png|webp)$", re.I)
          pages = []

          files = []
          for p in assets.iterdir():
              if p.is_file():
                  m = pattern.match(p.name)
                  if m:
                      files.append((int(m.group(1)), p))
          files.sort(key=lambda x: x[0])

          if not files:
              raise SystemExit("No page images found in web/assets")

          for number, p in files:
              img = Image.open(p).convert("RGB")

              # 手机双指放大仍保持清晰；同时显著降低流量。
              max_side = 2200
              if max(img.size) > max_side:
                  ratio = max_side / max(img.size)
                  img = img.resize(
                      (round(img.width * ratio), round(img.height * ratio)),
                      Image.Resampling.LANCZOS
                  )

              name = f"page{number}.webp"
              dest = opt / name
              img.save(dest, "WEBP", quality=82, method=6, optimize=True)
              pages.append(f"./assets/optimized/{name}")

              print(
                  f"{p.name}: {p.stat().st_size/1024:.0f} KB"
                  f" -> {dest.stat().st_size/1024:.0f} KB"
              )

          (build / "pages.json").write_text(
              json.dumps(pages, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Built {len(pages)} pages")
          PY

      - name: Configure Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: handjournal-1474338123
          COS_REGION: ap-guangzhou
        run: |
          coscmd config \
            -a "$TENCENT_SECRET_ID" \
            -s "$TENCENT_SECRET_KEY" \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"

      - name: Upload website to COS
        run: |
          coscmd upload -rfs --delete _site/ /

      - name: Done
        run: |
          echo "HandJournal deployed to Tencent COS."
          echo "Bucket: handjournal-1474338123"
          echo "Region: ap-guangzhou"
