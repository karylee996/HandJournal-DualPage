name: Deploy HandJournal to Tencent COS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-cos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handjournal-cos-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cos-python-sdk-v5

      - name: Build China site
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re, shutil

          src = Path("web")
          build = Path("_site")
          assets = src / "assets"
          opt = build / "assets" / "optimized"

          if build.exists():
              shutil.rmtree(build)
          opt.mkdir(parents=True, exist_ok=True)

          shutil.copy2(src / "index.html", build / "index.html")

          pattern = re.compile(r"^page(\d+)\.(jpg|jpeg|png|webp)$", re.I)
          files = []

          for p in assets.iterdir():
              if p.is_file():
                  m = pattern.match(p.name)
                  if m:
                      files.append((int(m.group(1)), p))

          files.sort(key=lambda x: x[0])

          if not files:
              raise SystemExit("No page images found in web/assets")

          pages = []

          for number, p in files:
              img = Image.open(p).convert("RGB")

              # 兼顾手机清晰度、双指放大和加载速度
              max_side = 2200
              if max(img.size) > max_side:
                  ratio = max_side / max(img.size)
                  img = img.resize(
                      (round(img.width * ratio), round(img.height * ratio)),
                      Image.Resampling.LANCZOS
                  )

              name = f"page{number}.webp"
              dest = opt / name
              img.save(dest, "WEBP", quality=82, method=6, optimize=True)

              pages.append(f"./assets/optimized/{name}")

              print(
                  f"{p.name}: {p.stat().st_size/1024:.0f} KB"
                  f" -> {dest.stat().st_size/1024:.0f} KB"
              )

          (build / "pages.json").write_text(
              json.dumps(pages, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Built {len(pages)} pages")
          PY

      - name: Upload website to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: handjournal-1474338123
          COS_REGION: ap-guangzhou
        run: |
          python - <<'PY'
          from pathlib import Path
          from qcloud_cos import CosConfig, CosS3Client
          import os, mimetypes

          secret_id = os.environ["TENCENT_SECRET_ID"]
          secret_key = os.environ["TENCENT_SECRET_KEY"]
          bucket = os.environ["COS_BUCKET"]
          region = os.environ["COS_REGION"]

          if not secret_id or not secret_key:
              raise SystemExit("Tencent COS secrets are empty")

          config = CosConfig(
              Region=region,
              SecretId=secret_id,
              SecretKey=secret_key,
              Scheme="https",
          )
          client = CosS3Client(config)

          root = Path("_site")

          cache_rules = {
              ".html": "no-cache, no-store, must-revalidate",
              ".json": "no-cache, no-store, must-revalidate",
              ".webp": "public, max-age=31536000, immutable",
          }

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue

              key = path.relative_to(root).as_posix()
              content_type = mimetypes.guess_type(path.name)[0] or "application/octet-stream"
              cache_control = cache_rules.get(path.suffix.lower(), "public, max-age=3600")

              with path.open("rb") as f:
                  client.put_object(
                      Bucket=bucket,
                      Body=f,
                      Key=key,
                      ContentType=content_type,
                      CacheControl=cache_control,
                  )

              print(f"Uploaded: {key}")

          print("Upload completed successfully.")
          PY

      - name: Done
        run: |
          echo "HandJournal deployed to Tencent COS."
          echo "Bucket: handjournal-1474338123"
          echo "Region: ap-guangzhou"
